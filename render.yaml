services:
  - type: worker
    name: hisobl-bot
    runtime: docker
    plan: starter
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hisobl-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai

databases:
  - name: hisobl-db
    plan: starter
    databaseName: hisobl_bot
    postgresMajorVersion: 16
